{% extends 'v2/base.html' %}{% block title %}Operator sign in — Open Estia{% endblock %}{% block content %}<section class="section wrap narrow"><p class="eyebrow">Private workspace</p><h1 lang="en">Welcome back.</h1><p>Manage inquiries, hosts and the journal.</p><form method="post" class="form-paper login-form"><input type="hidden" name="csrf" value="{{ csrf }}">{% if error %}<p class="form-errors" role="alert">{{ error }}</p>{% endif %}<div class="field"><label for="email">Email</label><input type="email" name="email" id="email" autocomplete="username" required value="{{ request.form.get('email','') }}"></div><div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128"></div><button class="button">Sign in ↗</button></form></section>{% endblock %}
